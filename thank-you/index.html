<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =========================================================
         BRIGHTSIDE HOUSTON DETAILING
         QR THANK-YOU PAGE
         ========================================================= -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <meta
        name="description"
        content="Thank you for choosing BrightSide Houston Mobile Detailing."
    >

    <title>
        Thank You | BrightSide Houston Mobile Detailing
    </title>


    <!-- =========================================================
         GOOGLE FONTS
         ========================================================= -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================================================
           COLORS
           ========================================================= */

        :root {

            --blue: #1769aa;
            --blue-dark: #12558c;
            --navy: #102033;

            --text: #30475d;
            --muted: #607991;

            --sky-top: #a9dcf6;
            --sky-middle: #dff3fc;
            --sky-bottom: #f5fbff;

            --white: #ffffff;

        }


        /* =========================================================
           RESET
           ========================================================= */

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }


        html {

            width: 100%;

            min-height: 100%;

        }


        body {

            width: 100%;

            min-height: 100vh;

            min-height: 100svh;

            margin: 0;

            overflow: hidden;

            font-family:
                "DM Sans",
                Arial,
                sans-serif;

            color: var(--text);

        }


        /* =========================================================
           PAGE

           The page is divided into two visual areas:

           1. Main thank-you area
           2. Bottom pixel-art city

           Keeping the city absolutely positioned prevents the
           content from ever colliding with the buildings.
           ========================================================= */

        .thank-you-page {

            position: relative;

            width: 100%;

            min-height: 100vh;

            min-height: 100svh;

            overflow: hidden;

            background:

                radial-gradient(
                    circle at 50% 17%,
                    rgba(
                        255,
                        255,
                        255,
                        0.95
                    ) 0%,
                    rgba(
                        255,
                        255,
                        255,
                        0.55
                    ) 23%,
                    transparent 48%
                ),

                linear-gradient(
                    180deg,
                    var(--sky-top) 0%,
                    var(--sky-middle) 35%,
                    var(--sky-bottom) 78%,
                    #e3f5fd 100%
                );

        }


        /* =========================================================
           SOFT SUN / LIGHT
           ========================================================= */

        .sun-glow {

            position: absolute;

            width:
                min(720px, 100vw);

            height:
                min(720px, 100vw);

            top:
                -410px;

            left:
                50%;

            transform:
                translateX(-50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(
                        255,
                        255,
                        255,
                        0.95
                    ) 0%,
                    rgba(
                        255,
                        255,
                        255,
                        0
                    ) 70%
                );

            pointer-events: none;

        }


        /* =========================================================
           PIXEL CLOUDS
           ========================================================= */

        .pixel-cloud {

            position: absolute;

            width: 116px;

            height: 22px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.62
                );

            image-rendering:
                pixelated;

            z-index: 1;

            pointer-events: none;

            animation:
                cloudDrift
                18s
                ease-in-out
                infinite
                alternate;

        }


        .pixel-cloud::before {

            content: "";

            position: absolute;

            width: 38px;

            height: 32px;

            left: 17px;

            bottom: 0;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.62
                );

        }


        .pixel-cloud::after {

            content: "";

            position: absolute;

            width: 46px;

            height: 38px;

            left: 52px;

            bottom: 0;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.62
                );

        }


        .cloud-one {

            top: 118px;

            left: -45px;

        }


        .cloud-two {

            top: 195px;

            right: -65px;

            transform:
                scale(0.78);

            animation-delay:
                -7s;

        }


        .cloud-three {

            top: 370px;

            left: -105px;

            transform:
                scale(0.55);

            animation-delay:
                -12s;

        }


        .cloud-four {

            top: 410px;

            right: -100px;

            transform:
                scale(0.48);

            animation-delay:
                -3s;

        }


        @keyframes cloudDrift {

            from {

                translate:
                    0 0;

            }

            to {

                translate:
                    48px 5px;

            }

        }


        /* =========================================================
           MAIN CONTENT

           The bottom padding reserves the city area.

           The content itself never enters the skyline zone.
           ========================================================= */

        .content {

            position: relative;

            z-index: 10;

            width: min(
                760px,
                calc(100% - 40px)
            );

            height: calc(
                100vh - 185px
            );

            min-height: 0;

            margin:
                0 auto;

            padding-top:
                clamp(
                    34px,
                    5vh,
                    58px
                );

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;

        }


        /* =========================================================
           BRIGHTSIDE LOGO
           ========================================================= */

        .brand {

            position: relative;

            display: flex;

            flex-direction: column;

            align-items: center;

            margin-bottom:
                clamp(
                    24px,
                    3.5vh,
                    34px
                );

            opacity: 0;

            transform:
                translateY(-10px);

            animation:
                fadeLogo
                0.7s
                0.1s
                ease
                forwards;

        }


        .brand-name {

            position: relative;

            font-family:
                "Space Grotesk",
                Arial,
                sans-serif;

            color:
                var(--navy);

            font-size:
                clamp(
                    31px,
                    5vw,
                    48px
                );

            line-height: 1;

            font-weight: 700;

            letter-spacing:
                3px;

        }


        /* BrightSide sun mark */

        .brand-name::before {

            content: "";

            position: absolute;

            width: 29px;

            height: 15px;

            left: 50%;

            top: -20px;

            transform:
                translateX(-50%);

            border:
                4px solid
                var(--blue);

            border-bottom:
                0;

            border-radius:
                30px 30px 0 0;

        }


        .brand-name::after {

            content: "";

            position: absolute;

            width: 4px;

            height: 13px;

            left: 50%;

            top: -27px;

            transform:
                translateX(-50%);

            background:
                var(--blue);

        }


        .brand-subtitle {

            margin-top: 9px;

            color:
                var(--blue);

            font-size:
                clamp(
                    9px,
                    1.7vw,
                    12px
                );

            line-height: 1;

            font-weight: 700;

            letter-spacing:
                4px;

        }


        @keyframes fadeLogo {

            from {

                opacity: 0;

                transform:
                    translateY(-10px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* =========================================================
           CHECKMARK
           ========================================================= */

        .check {

            position: relative;

            width:
                clamp(
                    74px,
                    9vw,
                    90px
                );

            height:
                clamp(
                    74px,
                    9vw,
                    90px
                );

            margin-bottom:
                clamp(
                    20px,
                    3vh,
                    27px
                );

            opacity: 0;

            transform:
                scale(0.7);

            animation:
                checkIn
                0.7s
                0.45s
                cubic-bezier(
                    .22,
                    1,
                    .36,
                    1
                )
                forwards;

        }


        .check-circle {

            width: 100%;

            height: 100%;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.42
                );

            border:
                3px solid
                rgba(
                    23,
                    105,
                    170,
                    0.25
                );

            box-shadow:
                0 10px 26px
                rgba(
                    23,
                    105,
                    170,
                    0.08
                );

        }


        .check-mark {

            width: 33%;

            height: 21%;

            border-left:
                5px solid
                var(--blue);

            border-bottom:
                5px solid
                var(--blue);

            transform:
                rotate(-45deg)
                translate(
                    3px,
                    -3px
                );

        }


        .check::after {

            content: "";

            position: absolute;

            inset: -9px;

            border:
                2px solid
                rgba(
                    23,
                    105,
                    170,
                    0.10
                );

            border-radius: 50%;

            animation:
                pulse
                2.5s
                1.2s
                ease-out
                infinite;

        }


        @keyframes checkIn {

            from {

                opacity: 0;

                transform:
                    scale(0.7);

            }

            to {

                opacity: 1;

                transform:
                    scale(1);

            }

        }


        @keyframes pulse {

            0% {

                opacity: 0.7;

                transform:
                    scale(0.9);

            }

            70% {

                opacity: 0;

                transform:
                    scale(1.18);

            }

            100% {

                opacity: 0;

                transform:
                    scale(1.18);

            }

        }


        /* =========================================================
           TEXT
           ========================================================= */

        .eyebrow {

            margin-bottom: 10px;

            color:
                var(--blue);

            font-size:
                clamp(
                    10px,
                    1.5vw,
                    13px
                );

            line-height: 1;

            font-weight: 700;

            letter-spacing:
                3px;

            text-transform:
                uppercase;

            opacity: 0;

            animation:
                fadeUp
                0.6s
                0.72s
                ease
                forwards;

        }


        h1 {

            max-width: 700px;

            margin-bottom: 18px;

            font-family:
                "Space Grotesk",
                Arial,
                sans-serif;

            color:
                var(--navy);

            font-size:
                clamp(
                    38px,
                    6.5vw,
                    62px
                );

            line-height:
                1.02;

            font-weight: 700;

            letter-spacing:
                -2px;

            opacity: 0;

            animation:
                fadeUp
                0.7s
                0.85s
                ease
                forwards;

        }


        .message {

            max-width: 610px;

            color:
                var(--muted);

            font-size:
                clamp(
                    14px,
                    1.9vw,
                    17px
                );

            line-height:
                1.65;

            opacity: 0;

            animation:
                fadeUp
                0.7s
                0.98s
                ease
                forwards;

        }


        /* =========================================================
           BUTTONS
           ========================================================= */

        .buttons {

            width: 100%;

            max-width: 550px;

            margin-top:
                clamp(
                    26px,
                    3.5vh,
                    36px
                );

            display:
                flex;

            flex-direction:
                column;

            gap: 11px;

            opacity: 0;

            transform:
                translateY(12px);

            animation:
                fadeUp
                0.7s
                1.12s
                ease
                forwards;

        }


        .button {

            position: relative;

            width: 100%;

            height:
                clamp(
                    53px,
                    6.5vh,
                    59px
                );

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                14px;

            padding:
                12px 22px;

            text-decoration:
                none;

            font-size:
                15px;

            font-weight:
                700;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;

        }


        .button:hover {

            transform:
                translateY(-2px);

        }


        .button-review {

            color:
                var(--white);

            background:
                linear-gradient(
                    135deg,
                    #2182ca,
                    var(--blue-dark)
                );

            box-shadow:
                0 10px 24px
                rgba(
                    23,
                    105,
                    170,
                    0.20
                );

        }


        .button-secondary {

            color:
                #104e80;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.72
                );

            border:
                1px solid
                #b8d5e9;

        }


        .button-secondary:hover {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.95
                );

        }


        /* =========================================================
           PIXEL CITY

           IMPORTANT:
           This entire element is isolated from the content.

           Nothing inside the content can overlap the buildings.
           ========================================================= */

        .city {

            position: absolute;

            z-index: 5;

            left: 0;

            bottom: 0;

            width: 100%;

            height:
                clamp(
                    150px,
                    19vh,
                    190px
                );

            pointer-events:
                none;

        }


        /* =========================================================
           CITY BUILDINGS
           ========================================================= */

        .buildings {

            position: absolute;

            left: 50%;

            bottom: 27px;

            width:
                min(
                    760px,
                    100%
                );

            height: 155px;

            transform:
                translateX(-50%);

            display:
                flex;

            align-items:
                flex-end;

            justify-content:
                center;

            gap: 4px;

        }


        .building {

            position: relative;

            flex-shrink: 0;

            background:
                linear-gradient(
                    90deg,
                    #5aa0d1,
                    #1c6fae
                );

            image-rendering:
                pixelated;

        }


        .building::after {

            content: "";

            position: absolute;

            left: 7px;

            right: 7px;

            top: 9px;

            bottom: 7px;

            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(
                        225,
                        246,
                        255,
                        0.55
                    ) 0 3px,
                    transparent 3px 12px
                );

        }


        .building-1 {

            width: 40px;

            height: 66px;

        }


        .building-2 {

            width: 48px;

            height: 88px;

        }


        .building-3 {

            width: 36px;

            height: 75px;

        }


        .building-4 {

            width: 57px;

            height: 106px;

        }


        .building-5 {

            width: 39px;

            height: 83px;

        }


        .building-6 {

            width: 70px;

            height: 151px;

            background:
                linear-gradient(
                    90deg,
                    #377fb9,
                    #135e9e
                );

        }


        .building-6::before {

            content: "";

            position: absolute;

            width: 5px;

            height: 28px;

            left: 50%;

            top: -28px;

            transform:
                translateX(-50%);

            background:
                #1769aa;

        }


        .building-7 {

            width: 43px;

            height: 94px;

        }


        .building-8 {

            width: 58px;

            height: 118px;

        }


        .building-9 {

            width: 37px;

            height: 73px;

        }


        .building-10 {

            width: 61px;

            height: 103px;

        }


        .building-11 {

            width: 45px;

            height: 81px;

        }


        /* =========================================================
           PIXEL TREE LINE
           ========================================================= */

        .trees {

            position: absolute;

            left: 0;

            bottom: 24px;

            width: 100%;

            height: 31px;

            background:
                #76b4d8;

            clip-path:
                polygon(
                    0 72%,
                    3% 50%,
                    6% 70%,
                    9% 44%,
                    12% 68%,
                    15% 48%,
                    18% 71%,
                    21% 46%,
                    24% 68%,
                    27% 42%,
                    30% 70%,
                    33% 48%,
                    36% 68%,
                    39% 44%,
                    42% 70%,
                    45% 49%,
                    48% 69%,
                    51% 43%,
                    54% 71%,
                    57% 48%,
                    60% 69%,
                    63% 49%,
                    66% 69%,
                    69% 44%,
                    72% 70%,
                    75% 48%,
                    78% 69%,
                    81% 45%,
                    84% 70%,
                    87% 49%,
                    90% 69%,
                    93% 46%,
                    96% 70%,
                    100% 48%,
                    100% 100%,
                    0 100%
                );

        }


        /* =========================================================
           WATER
           ========================================================= */

        .water {

            position: absolute;

            left: 0;

            bottom: 0;

            width: 100%;

            height: 25px;

            background:
                repeating-linear-gradient(
                    to bottom,
                    #c2e7f7 0 3px,
                    #8bc8e7 3px 6px
                );

        }


        /* =========================================================
           DESKTOP
           ========================================================= */

        @media (min-width: 901px) {

            .content {

                padding-top:
                    48px;

            }

        }


        /* =========================================================
           TABLET
           ========================================================= */

        @media (max-width: 700px) {

            body {

                overflow:
                    hidden;

            }


            .content {

                width:
                    calc(
                        100% - 32px
                    );

                height:
                    calc(
                        100svh - 150px
                    );

                padding-top:
                    30px;

            }


            .brand {

                margin-bottom:
                    24px;

            }


            .check {

                margin-bottom:
                    21px;

            }


            h1 {

                max-width:
                    440px;

                font-size:
                    clamp(
                        36px,
                        10vw,
                        50px
                    );

                letter-spacing:
                    -1.5px;

            }


            .message {

                max-width:
                    390px;

                font-size:
                    14.5px;

            }


            .buttons {

                max-width:
                    440px;

                margin-top:
                    27px;

            }


            .city {

                height:
                    140px;

            }


            .buildings {

                width:
                    670px;

                height:
                    130px;

                bottom:
                    24px;

                transform:
                    translateX(-50%)
                    scale(0.78);

                transform-origin:
                    bottom center;

            }


            .trees {

                bottom:
                    22px;

            }


            .water {

                height:
                    23px;

            }


            .cloud-three,
            .cloud-four {

                display:
                    none;

            }

        }


        /* =========================================================
           SMALL PHONES
           ========================================================= */

        @media (max-width: 430px) {

            .content {

                width:
                    calc(
                        100% - 28px
                    );

                height:
                    calc(
                        100svh - 130px
                    );

                padding-top:
                    27px;

            }


            .brand {

                margin-bottom:
                    21px;

            }


            .brand-name {

                font-size:
                    29px;

            }


            .brand-subtitle {

                font-size:
                    8px;

                letter-spacing:
                    3px;

            }


            .check {

                width:
                    72px;

                height:
                    72px;

                margin-bottom:
                    19px;

            }


            .eyebrow {

                font-size:
                    9.5px;

                letter-spacing:
                    2px;

            }


            h1 {

                max-width:
                    350px;

                margin-bottom:
                    14px;

                font-size:
                    35px;

            }


            .message {

                max-width:
                    330px;

                font-size:
                    13.5px;

                line-height:
                    1.55;

            }


            .buttons {

                margin-top:
                    23px;

                gap:
                    9px;

            }


            .button {

                height:
                    52px;

                min-height:
                    52px;

                font-size:
                    14px;

                border-radius:
                    13px;

            }


            .city {

                height:
                    119px;

            }


            .buildings {

                width:
                    620px;

                height:
                    125px;

                bottom:
                    21px;

                transform:
                    translateX(-50%)
                    scale(0.64);

                transform-origin:
                    bottom center;

            }


            .trees {

                bottom:
                    20px;

                height:
                    28px;

            }


            .water {

                height:
                    21px;

            }


            .cloud-one {

                top:
                    105px;

                left:
                    -75px;

                transform:
                    scale(0.72);

            }


            .cloud-two {

                top:
                    175px;

                right:
                    -85px;

                transform:
                    scale(0.62);

            }

        }


        /* =========================================================
           VERY SHORT SCREENS

           Prevents the buttons from being pushed into the city
           on short phones.
           ========================================================= */

        @media (
            max-height: 700px
        ) {

            .content {

                padding-top:
                    22px;

            }


            .brand {

                margin-bottom:
                    17px;

            }


            .check {

                width:
                    64px;

                height:
                    64px;

                margin-bottom:
                    15px;

            }


            h1 {

                font-size:
                    clamp(
                        31px,
                        8vw,
                        44px
                    );

                margin-bottom:
                    11px;

            }


            .message {

                font-size:
                    13px;

            }


            .buttons {

                margin-top:
                    19px;

                gap:
                    7px;

            }


            .button {

                height:
                    45px;

                min-height:
                    45px;

            }

        }


        /* =========================================================
           REDUCED MOTION
           ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.01ms !important;

            }

        }

    </style>

</head>


<body>


    <main class="thank-you-page">


        <!-- =====================================================
             SOFT BACKGROUND LIGHT
             ===================================================== -->

        <div
            class="sun-glow"
            aria-hidden="true"
        ></div>


        <!-- =====================================================
             PIXEL CLOUDS
             ===================================================== -->

        <div
            class="pixel-cloud cloud-one"
            aria-hidden="true"
        ></div>

        <div
            class="pixel-cloud cloud-two"
            aria-hidden="true"
        ></div>

        <div
            class="pixel-cloud cloud-three"
            aria-hidden="true"
        ></div>

        <div
            class="pixel-cloud cloud-four"
            aria-hidden="true"
        ></div>


        <!-- =====================================================
             MAIN THANK-YOU CONTENT
             ===================================================== -->

        <section class="content">


            <!-- =================================================
                 BRIGHTSIDE BRAND
                 ================================================= -->

            <div class="brand">

                <span class="brand-name">
                    BRIGHTSIDE HOUSTON
                </span>

                <span class="brand-subtitle">
                    MOBILE DETAILING
                </span>

            </div>


            <!-- =================================================
                 COMPLETION CHECK
                 ================================================= -->

            <div
                class="check"
                aria-hidden="true"
            >

                <div class="check-circle">

                    <span
                        class="check-mark"
                    ></span>

                </div>

            </div>


            <!-- =================================================
                 TEXT
                 ================================================= -->

            <p class="eyebrow">
                Your detail is complete
            </p>


            <h1>
                Thank you for choosing BrightSide.
            </h1>


            <p class="message">

                We appreciate you trusting
